[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdg-loan-renewal"
version = "0.1.0"
description = "Caso educativo reproducible de propensión comercial a renovar préstamos"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.3.5", "pandas==2.2.3", "scikit-learn==1.8.0", "joblib==1.5.3", "matplotlib==3.10.8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
smote = ["imbalanced-learn>=0.14,<0.15"]
xgboost = ["xgboost>=3,<4"]

[project.scripts]
loan-renewal = "loan_renewal.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
